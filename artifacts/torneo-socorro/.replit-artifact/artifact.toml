kind = "web"
previewPath = "/"
title = "Torneo Socorro"
description = "Sistema de gestión del Torneo Socorro Senior Master Plus 40 — fútbol amateur colombiano. Maneja equipos, jugadores, resultados de partidos, tabla de posiciones, goleadores, tarjetas (amarillas/rojas), fair play y control de pagos de inscripciones y multas."
version = "1.0.0"
id = "artifacts/torneo-socorro"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22660

[services.development]
run = "pnpm --filter @workspace/torneo-socorro run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/torneo-socorro", "run", "build" ]
serve = "static"
publicDir = "artifacts/torneo-socorro/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22660"
BASE_PATH = "/"
