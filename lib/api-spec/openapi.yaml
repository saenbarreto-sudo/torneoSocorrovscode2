openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Torneo Socorro Senior Master Plus 40 - Tournament Management API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: equipos
    description: Team operations
  - name: jugadores
    description: Player operations
  - name: partidos
    description: Match operations
  - name: posiciones
    description: Standings operations
  - name: goleadores
    description: Top scorers
  - name: tarjetas
    description: Cards and sanctions
  - name: pagos
    description: Payment operations
  - name: programacion
    description: Tournament schedule
  - name: dashboard
    description: Dashboard summary
  - name: auth
    description: Login and session
  - name: usuarios
    description: User accounts (admin only)
  - name: goles
    description: Individual goal records
  - name: planilla
    description: Match roster sheet (planilla de mesa)
  - name: vallas
    description: Least-beaten defenses
  - name: sanciones
    description: Active suspensions
  - name: egresos
    description: Organization expenses
  - name: mesas
    description: Match-day cash sheet (la mesa)
  - name: eventos
    description: Activity log (admin only)
  - name: temporadas
    description: Closing a tournament and starting a new one

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── DASHBOARD ──────────────────────────────────────────────────────────────
  /dashboard/resumen:
    get:
      operationId: getDashboardResumen
      tags: [dashboard]
      summary: Tournament summary stats
      parameters:
        - $ref: "#/components/parameters/Temporada"
      responses:
        "200":
          description: Summary stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardResumen"

  # ── EQUIPOS ────────────────────────────────────────────────────────────────
  /equipos:
    get:
      operationId: getEquipos
      tags: [equipos]
      summary: List all teams
      responses:
        "200":
          description: List of teams
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Equipo"
    post:
      operationId: createEquipo
      tags: [equipos]
      summary: Create a team
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EquipoInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Equipo"

  /equipos/{id}:
    get:
      operationId: getEquipo
      tags: [equipos]
      summary: Get a team
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Equipo"
        "404":
          description: Not found
    patch:
      operationId: updateEquipo
      tags: [equipos]
      summary: Update a team
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EquipoUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Equipo"
    delete:
      operationId: deleteEquipo
      tags: [equipos]
      summary: Delete a team
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted

  # ── JUGADORES ──────────────────────────────────────────────────────────────
  /jugadores:
    get:
      operationId: getJugadores
      tags: [jugadores]
      summary: List all players
      parameters:
        - name: equipoId
          in: query
          required: false
          schema:
            type: number
      responses:
        "200":
          description: List of players
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Jugador"
    post:
      operationId: createJugador
      tags: [jugadores]
      summary: Register a player
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JugadorInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Jugador"

  /jugadores/{id}:
    get:
      operationId: getJugador
      tags: [jugadores]
      summary: Get a player
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Player
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Jugador"
        "404":
          description: Not found
    patch:
      operationId: updateJugador
      tags: [jugadores]
      summary: Update a player
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JugadorUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Jugador"
    delete:
      operationId: deleteJugador
      tags: [jugadores]
      summary: Delete a player
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted

  /jugadores/{id}/historial:
    get:
      operationId: getJugadorHistorial
      tags: [jugadores]
      summary: Per-team, per-season career stats for a player (goals, cards, matches played)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Team-by-team history, most recent stint first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JugadorHistorialEquipo"

  # ── PARTIDOS ───────────────────────────────────────────────────────────────
  /partidos:
    get:
      operationId: getPartidos
      tags: [partidos]
      summary: List matches
      parameters:
        - name: semana
          in: query
          required: false
          schema:
            type: number
        - name: equipoId
          in: query
          required: false
          schema:
            type: number
        - name: desde
          in: query
          required: false
          description: Fecha mínima (inclusive), para traer los partidos de una Programación por su rango.
          schema:
            type: string
        - name: hasta
          in: query
          required: false
          description: Fecha máxima (inclusive).
          schema:
            type: string
        - $ref: "#/components/parameters/Temporada"
      responses:
        "200":
          description: List of matches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Partido"
    post:
      operationId: createPartido
      tags: [partidos]
      summary: Create a match
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartidoInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Partido"

  /partidos/lote:
    post:
      operationId: createPartidosLote
      tags: [partidos]
      summary: Create several matches at once (calendar generator)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartidosLoteInput"
      responses:
        "201":
          description: Result of the bulk creation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartidosLoteResult"

  /partidos/{id}:
    get:
      operationId: getPartido
      tags: [partidos]
      summary: Get a match
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Match
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Partido"
        "404":
          description: Not found
    patch:
      operationId: updatePartido
      tags: [partidos]
      summary: Update a match result
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartidoUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Partido"
    delete:
      operationId: deletePartido
      tags: [partidos]
      summary: Delete a match
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted

  # ── POSICIONES ─────────────────────────────────────────────────────────────
  /posiciones:
    get:
      operationId: getPosiciones
      tags: [posiciones]
      summary: Get standings table
      parameters:
        - name: fase
          in: query
          required: false
          description: >
            Si se omite, trae la tabla general (primera + segunda vuelta,
            o partidos sin fase asignada). Si se pasa, filtra solo los
            partidos de esa fase exacta (ej. "Liguilla", "Cuartos").
          schema:
            type: string
        - $ref: "#/components/parameters/Temporada"
      responses:
        "200":
          description: Standings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PosicionEquipo"

  /fases:
    get:
      operationId: getFases
      tags: [posiciones]
      summary: List the extra tournament phases in play (beyond the regular season)
      description: >
        Fases distintas a "Primera vuelta"/"Segunda vuelta" que ya tienen
        partidos en el torneo actual (esas dos son la tabla general), con su
        tipo (para saber si Posiciones la muestra como tabla de puntos o
        como resultados de llave) y en el orden real en que se crearon.
        Sirve para armar el selector de fases en Posiciones y en "Armar
        fase".
      parameters:
        - $ref: "#/components/parameters/Temporada"
      responses:
        "200":
          description: List of phases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Fase"
    post:
      operationId: createFasesLote
      tags: [posiciones]
      summary: Register one or more phases at once (used by the "Armar fase" wizard)
      description: >
        Registra el tipo de una o varias fases nuevas (temporada_regular,
        grupos, liguilla o eliminacion). Si una fase ya estaba registrada,
        se ignora — el primer registro manda, para no cambiarle el tipo por
        error a una fase que ya tiene partidos.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FasesLoteInput"
      responses:
        "201":
          description: Result of the bulk registration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FasesLoteResult"

  # ── TEMPORADAS ─────────────────────────────────────────────────────────────
  /temporadas:
    get:
      operationId: getTemporadas
      tags: [temporadas]
      summary: Closed tournaments, newest first
      responses:
        "200":
          description: Seasons
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Temporada"

  /temporadas/resumen-cierre:
    get:
      operationId: getResumenCierre
      tags: [temporadas]
      summary: What closing the current tournament would stamp (admin only)
      description: >
        Se consulta ANTES de cerrar, para poder mostrarle al usuario
        exactamente qué se va a sellar en vez de pedirle que confíe a ciegas
        en un botón que toca todo el torneo.
      responses:
        "200":
          description: Counts per table plus a suggested season name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResumenCierre"

  /temporadas/cerrar:
    post:
      operationId: cerrarTemporada
      tags: [temporadas]
      summary: Close the current tournament, stamping everything with its season (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CerrarTemporadaInput"
      responses:
        "201":
          description: Rows stamped per table
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CierreResultado"
        "409":
          description: Nothing to close, or that season name already exists

  # ── REGISTRO DE ACTIVIDAD ──────────────────────────────────────────────────
  /eventos:
    get:
      operationId: getEventos
      tags: [eventos]
      summary: Activity log — who created, edited, deleted or signed in (admin only)
      parameters:
        - name: usuarioId
          in: query
          required: false
          schema:
            type: number
        - name: accion
          in: query
          required: false
          schema:
            type: string
            enum: [ingreso, ingreso_fallido, crear, editar, borrar]
        - name: desde
          in: query
          required: false
          schema:
            type: string
        - name: hasta
          in: query
          required: false
          schema:
            type: string
        - name: limite
          in: query
          required: false
          schema:
            type: number
      responses:
        "200":
          description: Events, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Evento"

  # ── MESA ───────────────────────────────────────────────────────────────────
  /mesas:
    get:
      operationId: getMesas
      tags: [mesas]
      summary: History of match-day cash sheets, newest first
      parameters:
        - $ref: "#/components/parameters/Temporada"
      responses:
        "200":
          description: Mesas with their totals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MesaResumen"

  /mesas/resumen:
    get:
      operationId: getResumenMesas
      tags: [mesas]
      summary: Season totals of the match-day cash sheets, by concept
      description: >
        En qué se va la plata de la mesa en todo el torneo: cuánto entró por
        cada concepto (mesa, cintas) y cuánto salió por cada categoría
        (árbitros, cal, balones, trabajadores), sumando todos los días.
      parameters:
        - $ref: "#/components/parameters/Temporada"
      responses:
        "200":
          description: Totals by concept
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResumenMesas"

  /mesas/{fecha}:
    get:
      operationId: getMesaPorFecha
      tags: [mesas]
      summary: The cash sheet of one match day (income, expenses and balance)
      description: >
        Devuelve el cuadre de esa fecha. Si todavía no se ha creado la mesa
        de ese día, responde igual con las listas vacías y mesa en null, para
        que la pantalla pueda mostrar el día en blanco y listo para llenar.
      parameters:
        - name: fecha
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The day's cash sheet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MesaDetalle"
    put:
      operationId: guardarMesa
      tags: [mesas]
      summary: Save the whole cash sheet of a match day at once
      description: >
        Crea la mesa de esa fecha si no existía y reemplaza sus líneas por
        las que vengan en el cuerpo. Los ingresos se guardan como pagos de
        los equipos (entran al saldo de Tesorería y, si un equipo no paga,
        a su estado de cuenta) y los gastos como egresos del torneo.
      parameters:
        - name: fecha
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MesaGuardarInput"
      responses:
        "200":
          description: The saved cash sheet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MesaDetalle"
        "409":
          description: The mesa is already closed and cannot be modified

  /mesas/{id}/estado:
    patch:
      operationId: cambiarEstadoMesa
      tags: [mesas]
      summary: Close a cash sheet (or reopen it to fix something)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MesaEstadoInput"
      responses:
        "200":
          description: Updated mesa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MesaResumen"

  # ── GOLEADORES ─────────────────────────────────────────────────────────────
  /goleadores:
    get:
      operationId: getGoleadores
      tags: [goleadores]
      summary: Top scorers list
      parameters:
        - $ref: "#/components/parameters/Temporada"
      responses:
        "200":
          description: List of scorers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Goleador"

  # ── TARJETAS ───────────────────────────────────────────────────────────────
  /tarjetas:
    get:
      operationId: getTarjetas
      tags: [tarjetas]
      summary: List cards/sanctions
      parameters:
        - name: tipo
          in: query
          required: false
          schema:
            type: string
            enum: [amarilla, roja]
        - name: jugadorId
          in: query
          required: false
          schema:
            type: number
        - name: partidoId
          in: query
          required: false
          schema:
            type: number
        - $ref: "#/components/parameters/Temporada"
      responses:
        "200":
          description: List of cards
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tarjeta"
    post:
      operationId: createTarjeta
      tags: [tarjetas]
      summary: Register a card
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TarjetaInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tarjeta"

  /tarjetas/{id}:
    patch:
      operationId: updateTarjeta
      tags: [tarjetas]
      summary: Update a card/sanction
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TarjetaUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tarjeta"
    delete:
      operationId: deleteTarjeta
      tags: [tarjetas]
      summary: Delete a card
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted

  /amonestados:
    get:
      operationId: getAmonestados
      tags: [tarjetas]
      summary: Players with cards summary (fairplay)
      parameters:
        - $ref: "#/components/parameters/Temporada"
      responses:
        "200":
          description: List of warned players
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AmonestadoResumen"

  # ── PAGOS ──────────────────────────────────────────────────────────────────
  /pagos:
    get:
      operationId: getPagos
      tags: [pagos]
      summary: List all payment receipts
      parameters:
        - name: equipoId
          in: query
          required: false
          schema:
            type: number
        - name: concepto
          in: query
          required: false
          schema:
            type: string
        - $ref: "#/components/parameters/Temporada"
      responses:
        "200":
          description: List of payments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pago"
    post:
      operationId: createPago
      tags: [pagos]
      summary: Register a payment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PagoInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pago"

  /pagos/{id}:
    patch:
      operationId: updatePago
      tags: [pagos]
      summary: Update a payment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PagoUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pago"
    delete:
      operationId: deletePago
      tags: [pagos]
      summary: Delete a payment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted

  /pagos/resumen-equipos:
    get:
      operationId: getPagosResumenEquipos
      tags: [pagos]
      summary: Payment summary per team (inscriptions, debts)
      parameters:
        - name: concepto
          in: query
          required: false
          description: >-
            Uno de los conceptos de pago (Inscripcion, Multas, Carnet, Rojas,
            Amarillas, FOFI). Por defecto Inscripcion, que es el único
            concepto con un monto adeudado configurado por equipo (deuda de
            inscripción); para los demás solo se puede mostrar lo pagado.
          schema:
            type: string
        - $ref: "#/components/parameters/Temporada"
      responses:
        "200":
          description: Payment summary per team
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PagoEquipoResumen"

  # ── PROGRAMACION ───────────────────────────────────────────────────────────
  /programacion:
    get:
      operationId: getProgramacion
      tags: [programacion]
      summary: List tournament schedule weeks
      parameters:
        - $ref: "#/components/parameters/Temporada"
      responses:
        "200":
          description: Schedule
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SemanaFecha"
    post:
      operationId: createSemanaFecha
      tags: [programacion]
      summary: Add a scheduled week
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SemanaFechaInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SemanaFecha"

  /programacion/{id}:
    patch:
      operationId: updateSemanaFecha
      tags: [programacion]
      summary: Update a scheduled week
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SemanaFechaUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SemanaFecha"
    delete:
      operationId: deleteSemanaFecha
      tags: [programacion]
      summary: Delete a scheduled week and every match scheduled in it
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Deleted, including its matches
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteSemanaFechaResult"

  # ── AUTH ───────────────────────────────────────────────────────────────────
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in and obtain a bearer token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
        "401":
          description: Invalid credentials

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Current session user (used to restore the session on reload)
      responses:
        "200":
          description: Session user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionUser"
        "401":
          description: Not authenticated

  /auth/password:
    patch:
      operationId: cambiarPassword
      tags: [auth]
      summary: Change your own password (any signed-in user)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CambiarPasswordInput"
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
        "401":
          description: Not authenticated, or the current password is wrong

  # ── AJUSTES ──────────────────────────────────────────────────────────────
  /ajustes:
    get:
      operationId: getAjustes
      tags: [ajustes]
      summary: Get the tournament-wide money settings (referee fee, card fines, FOFI, transfer fee...)
      responses:
        "200":
          description: Current settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ajustes"
    patch:
      operationId: updateAjustes
      tags: [ajustes]
      summary: Update the tournament-wide money settings (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AjustesUpdate"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ajustes"

  # ── USUARIOS ───────────────────────────────────────────────────────────────
  /usuarios:
    get:
      operationId: getUsuarios
      tags: [usuarios]
      summary: List user accounts (admin only)
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Usuario"
    post:
      operationId: createUsuario
      tags: [usuarios]
      summary: Create a user account (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsuarioInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usuario"

  /usuarios/{id}:
    patch:
      operationId: updateUsuario
      tags: [usuarios]
      summary: Update a user account (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsuarioUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usuario"
    delete:
      operationId: deleteUsuario
      tags: [usuarios]
      summary: Delete a user account (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted

  # ── VALLAS ─────────────────────────────────────────────────────────────────
  /vallas:
    get:
      operationId: getVallas
      tags: [vallas]
      summary: Least-beaten defenses (valla menos vencida)
      parameters:
        - $ref: "#/components/parameters/Temporada"
      responses:
        "200":
          description: List of defenses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Valla"

  # ── SANCIONES ──────────────────────────────────────────────────────────────
  /sanciones:
    get:
      operationId: getSanciones
      tags: [sanciones]
      summary: Active suspensions with matches served / remaining
      parameters:
        - $ref: "#/components/parameters/Temporada"
      responses:
        "200":
          description: List of suspensions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Sancion"

  # ── PLANILLA ───────────────────────────────────────────────────────────────
  /partidos/{id}/planilla:
    get:
      operationId: getPlanilla
      tags: [planilla]
      summary: Match roster (planilla)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Roster for both teams
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Planilla"
        "404":
          description: Not found
    put:
      operationId: savePlanilla
      tags: [planilla]
      summary: Save the full match roster and recompute the score
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SavePlanillaInput"
      responses:
        "204":
          description: Saved
        "409":
          description: Match is a walkover and has no roster

  # ── GOLES ──────────────────────────────────────────────────────────────────
  /goles:
    get:
      operationId: getGoles
      tags: [goles]
      summary: List goals for a match (or all goals)
      parameters:
        - name: partidoId
          in: query
          required: false
          schema:
            type: number
        - $ref: "#/components/parameters/Temporada"
      responses:
        "200":
          description: List of goals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Gol"
    post:
      operationId: createGol
      tags: [goles]
      summary: Register a goal (or goals) for a player in a match
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GolInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Gol"

  /goles/{id}:
    delete:
      operationId: deleteGol
      tags: [goles]
      summary: Delete a goal entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted

  # ── EGRESOS ────────────────────────────────────────────────────────────────
  /egresos:
    get:
      operationId: getEgresos
      tags: [egresos]
      summary: List organization expenses
      parameters:
        - $ref: "#/components/parameters/Temporada"
      responses:
        "200":
          description: List of expenses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Egreso"
    post:
      operationId: createEgreso
      tags: [egresos]
      summary: Register an expense
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EgresoInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Egreso"

  /egresos/{id}:
    delete:
      operationId: deleteEgreso
      tags: [egresos]
      summary: Delete an expense
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted

components:
  parameters:
    # Qué torneo se está consultando. Si no viene, es el torneo EN CURSO
    # (sus datos no llevan sello de temporada). Con un valor tipo
    # "2025-2026" se consulta un torneo ya cerrado, en modo lectura.
    Temporada:
      name: temporada
      in: query
      required: false
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    # ── DASHBOARD ────────────────────────────────────────────────────────────
    DashboardResumen:
      type: object
      required: [totalEquipos, totalJugadores, totalPartidosJugados, totalPartidosProgramados, topGoleador, proximaFecha]
      properties:
        totalEquipos:
          type: number
        totalJugadores:
          type: number
        totalPartidosJugados:
          type: number
        totalPartidosProgramados:
          type: number
        totalGoles:
          type: number
        totalAmarillas:
          type: number
        totalRojas:
          type: number
        topGoleador:
          $ref: "#/components/schemas/Goleador"
        proximaFecha:
          type: ["string", "null"]
        recaudacionTotal:
          type: number

    # ── EQUIPOS ──────────────────────────────────────────────────────────────
    Equipo:
      type: object
      required: [id, nombre]
      properties:
        id:
          type: number
        nombre:
          type: string
        delegado:
          type: ["string", "null"]
        # Delegado suplente, para cuando el principal no puede asistir.
        delegado2:
          type: ["string", "null"]
        telefono:
          type: ["string", "null"]
        color:
          type: ["string", "null"]
        activo:
          type: boolean
        # Bonificación de segunda vuelta (Art. 19): 1 / 0.75 / 0.50 / 0.25
        # para los 4 equipos que avanzan a la liguilla.
        puntosBonificacion:
          type: number
        # Valor total de la inscripción de la temporada, en pesos.
        deudaInscripcion:
          type: number
        createdAt:
          type: string

    EquipoInput:
      type: object
      required: [nombre]
      properties:
        nombre:
          type: string
          minLength: 1
        delegado:
          type: string
        delegado2:
          type: string
        telefono:
          type: string
        color:
          type: string
        activo:
          type: boolean
        puntosBonificacion:
          type: number
          minimum: 0
          maximum: 1
        deudaInscripcion:
          type: number
          minimum: 0

    EquipoUpdate:
      type: object
      properties:
        nombre:
          type: string
          minLength: 1
        delegado:
          type: string
        delegado2:
          type: string
        telefono:
          type: string
        color:
          type: string
        activo:
          type: boolean
        puntosBonificacion:
          type: number
          minimum: 0
          maximum: 1
        deudaInscripcion:
          type: number
          minimum: 0

    # ── JUGADORES ────────────────────────────────────────────────────────────
    Jugador:
      type: object
      required: [id, nombre, equipoId, equipoNombre]
      properties:
        id:
          type: number
        cedula:
          type: ["string", "null"]
        nombre:
          type: string
        fechaNacimiento:
          type: ["string", "null"]
        equipoId:
          type: number
        equipoNombre:
          type: string
        nCarnet:
          type: ["number", "null"]
        # Data URL (base64) de la foto de carnet, o null si no tiene.
        foto:
          type: ["string", "null"]
        fechaFoto:
          type: ["string", "null"]
        # --- Carnetización ---
        carnetPagado:
          type: boolean
        carnetFechaPago:
          type: ["string", "null"]
        carnetValor:
          type: ["number", "null"]
        carnetFechaEntrega:
          type: ["string", "null"]
        carnetQuienRecibio:
          type: ["string", "null"]
        # Derivados de jugador_equipo_historial: el equipo del stint anterior
        # al actual, o null si nunca ha cambiado de equipo.
        ultimoEquipoId:
          type: ["number", "null"]
        ultimoEquipoNombre:
          type: ["string", "null"]
        # Fecha en que terminó ese paso por el equipo anterior.
        ultimoEquipoFechaFin:
          type: ["string", "null"]
        activo:
          type: boolean
        # Partidos jugados según la planilla (ver GET /jugadores). No lo
        # devuelven GET /jugadores/{id} ni create/update.
        partidosJugados:
          type: number
        createdAt:
          type: string

    JugadorInput:
      type: object
      required: [nombre, equipoId]
      properties:
        cedula:
          type: string
        nombre:
          type: string
          minLength: 1
        fechaNacimiento:
          type: string
        equipoId:
          type: number
        nCarnet:
          type: number
        foto:
          type: string
        fechaFoto:
          type: string
        activo:
          type: boolean
        carnetPagado:
          type: boolean
        carnetFechaPago:
          type: ["string", "null"]
        carnetValor:
          type: ["number", "null"]
        carnetFechaEntrega:
          type: ["string", "null"]
        carnetQuienRecibio:
          type: ["string", "null"]

    JugadorUpdate:
      type: object
      properties:
        cedula:
          type: string
        nombre:
          type: string
        fechaNacimiento:
          type: string
        equipoId:
          type: number
        nCarnet:
          type: number
        foto:
          type: string
        fechaFoto:
          type: string
        activo:
          type: boolean
        carnetPagado:
          type: boolean
        carnetFechaPago:
          type: ["string", "null"]
        carnetValor:
          type: ["number", "null"]
        carnetFechaEntrega:
          type: ["string", "null"]
        carnetQuienRecibio:
          type: ["string", "null"]

    JugadorHistorialEquipo:
      type: object
      required: [equipoId, equipoNombre, temporada, fechaInicio, fechaFin, partidosJugados, goles, amarillas, rojas]
      properties:
        equipoId:
          type: number
        equipoNombre:
          type: string
        # Temporada a la que pertenecen estas estadísticas ("2021-2022", ...).
        # null = torneo actual (ver schema/partidos.ts en el backend).
        temporada:
          type: ["string", "null"]
        fechaInicio:
          type: string
        fechaFin:
          type: ["string", "null"]
        partidosJugados:
          type: number
        goles:
          type: number
        amarillas:
          type: number
        rojas:
          type: number

    # ── PARTIDOS ─────────────────────────────────────────────────────────────
    Partido:
      type: object
      required: [id, semana, localId, localNombre, visitanteId, visitanteNombre, jugado]
      properties:
        id:
          type: number
        semana:
          type: number
        fecha:
          type: ["string", "null"]
        hora:
          type: ["string", "null"]
        localId:
          type: number
        localNombre:
          type: string
        visitanteId:
          type: number
        visitanteNombre:
          type: string
        golesLocal:
          type: ["number", "null"]
        golesVisitante:
          type: ["number", "null"]
        # Solo se llenan cuando un partido de eliminación termina empatado
        # y se define desde el punto penal.
        penalesLocal:
          type: ["number", "null"]
        penalesVisitante:
          type: ["number", "null"]
        jugado:
          type: boolean
        fase:
          type: ["string", "null"]
        arbitro:
          type: ["string", "null"]
        # Oficial de mesa que llenó la planilla del partido.
        mesa:
          type: ["string", "null"]
        # W.O. (Art. 23): marcador oficial 6-0, sin goleadores individuales.
        walkover:
          type: boolean
        walkoverGanadorId:
          type: ["number", "null"]
        createdAt:
          type: string

    PartidoInput:
      type: object
      required: [semana, localId, visitanteId, fase]
      properties:
        semana:
          type: number
        fecha:
          type: string
        hora:
          type: string
        localId:
          type: number
        visitanteId:
          type: number
        golesLocal:
          type: number
        golesVisitante:
          type: number
        # Solo se llenan cuando un partido de eliminación termina empatado y
        # se define desde el punto penal. Aceptan null para poder borrarlos
        # si se corrige el resultado y deja de estar empatado.
        penalesLocal:
          type: ["number", "null"]
        penalesVisitante:
          type: ["number", "null"]
        jugado:
          type: boolean
        fase:
          type: string
        arbitro:
          type: string
        mesa:
          type: string
        walkover:
          type: boolean
        walkoverGanadorId:
          type: number

    PartidoUpdate:
      type: object
      properties:
        semana:
          type: number
        fecha:
          type: string
        hora:
          type: string
        localId:
          type: number
        visitanteId:
          type: number
        golesLocal:
          type: number
        golesVisitante:
          type: number
        # Solo se llenan cuando un partido de eliminación termina empatado y
        # se define desde el punto penal. Aceptan null para poder borrarlos
        # si se corrige el resultado y deja de estar empatado.
        penalesLocal:
          type: ["number", "null"]
        penalesVisitante:
          type: ["number", "null"]
        jugado:
          type: boolean
        fase:
          type: string
        arbitro:
          type: string
        mesa:
          type: string
        walkover:
          type: boolean
        walkoverGanadorId:
          type: number

    PartidosLoteInput:
      type: object
      required: [partidos]
      properties:
        partidos:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/PartidoInput"

    PartidosLoteResult:
      type: object
      required: [creados, omitidos]
      properties:
        creados:
          type: number
        omitidos:
          type: number
          description: Partidos que ya existían con la misma semana y los mismos equipos.

    # ── POSICIONES ───────────────────────────────────────────────────────────
    PosicionEquipo:
      type: object
      required: [posicion, equipoId, equipoNombre, pj, pg, pe, pp, gf, gc, df, pts]
      properties:
        posicion:
          type: number
        equipoId:
          type: number
        equipoNombre:
          type: string
        # Bonificación de liguilla (Art. 19), criterio de desempate.
        puntosBonificacion:
          type: number
        # Puntaje de juego limpio (tarjetas), criterio de desempate.
        puntajeFairplay:
          type: number
        pj:
          type: number
        pg:
          type: number
        pe:
          type: number
        pp:
          type: number
        gf:
          type: number
        gc:
          type: number
        df:
          type: number
        pts:
          type: number
        pjLocal:
          type: number
        pgLocal:
          type: number
        peLocal:
          type: number
        ppLocal:
          type: number
        gfLocal:
          type: number
        gcLocal:
          type: number
        pjVisitante:
          type: number
        pgVisitante:
          type: number
        peVisitante:
          type: number
        ppVisitante:
          type: number
        gfVisitante:
          type: number
        gcVisitante:
          type: number

    Fase:
      type: object
      required: [nombre, tipo, orden]
      properties:
        nombre:
          type: string
        # temporada_regular | grupos | liguilla | eliminacion
        tipo:
          type: string
        orden:
          type: number

    FaseInput:
      type: object
      required: [nombre, tipo]
      properties:
        nombre:
          type: string
        tipo:
          type: string

    FasesLoteInput:
      type: object
      required: [fases]
      properties:
        fases:
          type: array
          items:
            $ref: "#/components/schemas/FaseInput"

    FasesLoteResult:
      type: object
      required: [registradas, omitidas]
      properties:
        registradas:
          type: number
        omitidas:
          type: number

    # ── GOLEADORES ───────────────────────────────────────────────────────────
    Goleador:
      type: object
      required: [jugadorId, jugadorNombre, equipoNombre, totalGoles]
      properties:
        jugadorId:
          type: number
        jugadorNombre:
          type: string
        equipoNombre:
          type: string
        totalGoles:
          type: number

    # ── TARJETAS ─────────────────────────────────────────────────────────────
    Tarjeta:
      type: object
      required: [id, jugadorId, jugadorNombre, equipoNombre, tipo, semana]
      properties:
        id:
          type: number
        jugadorId:
          type: number
        jugadorNombre:
          type: string
        # Número de carné del jugador, para identificarlo rápido en la tabla
        # de amonestados sin tener que buscarlo por nombre.
        nCarnet:
          type: ["number", "null"]
        equipoNombre:
          type: string
        tipo:
          type: string
          enum: [amarilla, roja]
        semana:
          type: number
        fecha:
          type: ["string", "null"]
        partidoId:
          type: ["number", "null"]
        valor:
          type: ["number", "null"]
        pagada:
          type: boolean
        sancion:
          type: ["string", "null"]
        # Fechas de suspensión pendientes de cumplir.
        fechasSancion:
          type: number
        createdAt:
          type: string

    TarjetaInput:
      type: object
      required: [jugadorId, tipo, semana]
      properties:
        jugadorId:
          type: number
        tipo:
          type: string
          enum: [amarilla, roja]
        semana:
          type: number
        fecha:
          type: string
        partidoId:
          type: number
        valor:
          type: number
        pagada:
          type: boolean
        sancion:
          type: string
        fechasSancion:
          type: number
          minimum: 0

    TarjetaUpdate:
      type: object
      properties:
        tipo:
          type: string
          enum: [amarilla, roja]
        semana:
          type: number
        fecha:
          type: string
        valor:
          type: number
        pagada:
          type: boolean
        sancion:
          type: string
        fechasSancion:
          type: number
          minimum: 0

    AmonestadoResumen:
      type: object
      required: [jugadorId, jugadorNombre, equipoNombre, amarillas, rojas]
      properties:
        jugadorId:
          type: number
        jugadorNombre:
          type: string
        nCarnet:
          type: ["number", "null"]
        equipoNombre:
          type: string
        amarillas:
          type: number
        rojas:
          type: number
        sancionFechas:
          type: ["number", "null"]

    # ── PAGOS ────────────────────────────────────────────────────────────────
    Pago:
      type: object
      required: [id, equipoId, equipoNombre, concepto, monto, semana]
      properties:
        id:
          type: number
        nRecibo:
          type: ["number", "null"]
        codigoRecibo:
          type: ["string", "null"]
        equipoId:
          type: number
        equipoNombre:
          type: string
        concepto:
          type: string
        monto:
          type: number
        semana:
          type: ["number", "null"]
        mes:
          type: ["string", "null"]
        fecha:
          type: ["string", "null"]
        # Cuando el pago corresponde a una multa por tarjeta, apunta a ella.
        tarjetaId:
          type: ["number", "null"]
        createdAt:
          type: string

    PagoInput:
      type: object
      required: [equipoId, concepto, monto]
      properties:
        equipoId:
          type: number
        concepto:
          type: string
        monto:
          type: number
        semana:
          type: number
        mes:
          type: string
        fecha:
          type: string
        tarjetaId:
          type: number

    PagoUpdate:
      type: object
      properties:
        concepto:
          type: string
        monto:
          type: number
        semana:
          type: number
        mes:
          type: string
        fecha:
          type: string

    PagoEquipoResumen:
      type: object
      required: [equipoId, equipoNombre, deudaTotal, pagado, saldo, porcentajePagado]
      properties:
        equipoId:
          type: number
        equipoNombre:
          type: string
        deudaTotal:
          type: number
        pagado:
          type: number
        saldo:
          type: number
        porcentajePagado:
          type: number

    # ── PROGRAMACION ─────────────────────────────────────────────────────────
    SemanaFecha:
      type: object
      required: [id, semana]
      properties:
        id:
          type: number
        semana:
          type: number
        nombreSemana:
          type: ["string", "null"]
        fechaDesde:
          type: ["string", "null"]
        fechaHasta:
          type: ["string", "null"]
        esFestivo:
          type: boolean

    SemanaFechaInput:
      type: object
      required: [semana]
      properties:
        semana:
          type: number
        nombreSemana:
          type: string
        fechaDesde:
          type: string
        fechaHasta:
          type: string
        esFestivo:
          type: boolean

    SemanaFechaUpdate:
      type: object
      properties:
        semana:
          type: number
        nombreSemana:
          type: string
        fechaDesde:
          type: string
        fechaHasta:
          type: string
        esFestivo:
          type: boolean

    DeleteSemanaFechaResult:
      type: object
      required: [partidosEliminados]
      properties:
        partidosEliminados:
          type: number
          description: Cuántos partidos del torneo actual tenían esta semana y se borraron con ella.

    # ── AUTH ─────────────────────────────────────────────────────────────────
    LoginInput:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1

    # ── TEMPORADAS ──────────────────────────────────────────────────────────
    Temporada:
      type: object
      required: [nombre, createdAt]
      properties:
        nombre:
          type: string
        # NULL en las temporadas importadas de los Excel viejos, que nunca
        # pasaron por el cierre desde la app.
        cerradaAt:
          type: ["string", "null"]
        createdAt:
          type: string

    ResumenCierre:
      type: object
      required: [nombreSugerido, partidos, goles, tarjetas, pagos, egresos, mesas, programacion, fases, jugadores]
      properties:
        nombreSugerido:
          type: string
        partidos:
          type: number
        goles:
          type: number
        tarjetas:
          type: number
        pagos:
          type: number
        egresos:
          type: number
        mesas:
          type: number
        programacion:
          type: number
        fases:
          type: number
        jugadores:
          type: number

    CerrarTemporadaInput:
      type: object
      required: [nombre]
      properties:
        nombre:
          type: string
          description: 'Nombre del torneo que se cierra, con la forma "2026-2027".'

    CierreResultado:
      type: object
      required: [nombre]
      properties:
        nombre:
          type: string
        partidos:
          type: number
        goles:
          type: number
        tarjetas:
          type: number
        pagos:
          type: number
        egresos:
          type: number
        mesas:
          type: number
        programacion:
          type: number
        fases:
          type: number
        jugadoresConFoto:
          type: number

    # ── REGISTRO DE ACTIVIDAD ───────────────────────────────────────────────
    # Una línea del registro: quién, qué hizo, sobre qué y cuándo. "cambios"
    # trae el antes → después campo por campo (nunca contraseñas ni fotos).
    EventoCambio:
      type: object
      required: [campo, antes, despues]
      properties:
        campo:
          type: string
        antes:
          type: string
        despues:
          type: string

    Evento:
      type: object
      required: [id, usuarioNombre, accion, entidad, descripcion, cambios, createdAt]
      properties:
        id:
          type: number
        usuarioId:
          type: ["number", "null"]
        usuarioNombre:
          type: string
        accion:
          type: string
          enum: [ingreso, ingreso_fallido, crear, editar, borrar]
        entidad:
          type: string
        entidadId:
          type: ["number", "null"]
        descripcion:
          type: string
        cambios:
          type: array
          items:
            $ref: "#/components/schemas/EventoCambio"
        createdAt:
          type: string

    # ── MESA ────────────────────────────────────────────────────────────────
    # La caja de un día de juego. Los ingresos son pagos de los equipos y los
    # gastos son egresos del torneo: por eso la mesa entra sola al saldo de
    # Tesorería, sin ser una bolsa de plata aparte.
    MesaResumen:
      type: object
      required: [id, fecha, estado, totalIngresos, totalEgresos, saldo]
      properties:
        id:
          type: number
        fecha:
          type: string
        nombre:
          type: ["string", "null"]
        estado:
          type: string
          enum: [abierta, cerrada]
        observaciones:
          type: ["string", "null"]
        totalIngresos:
          type: number
        totalEgresos:
          type: number
        saldo:
          type: number

    MesaIngreso:
      type: object
      required: [id, concepto, monto]
      properties:
        id:
          type: number
        equipoId:
          type: ["number", "null"]
        equipoNombre:
          type: ["string", "null"]
        concepto:
          type: string
        monto:
          type: number

    MesaEgreso:
      type: object
      required: [id, descripcion, valor]
      properties:
        id:
          type: number
        categoria:
          type: ["string", "null"]
        descripcion:
          type: string
        valor:
          type: number
        # El partido al que corresponde, cuando aplica: cada partido del día
        # puede tener su propio árbitro con su propio pago.
        partidoId:
          type: ["number", "null"]

    MesaDetalle:
      type: object
      required: [fecha, ingresos, egresos, totalIngresos, totalEgresos, saldo]
      properties:
        fecha:
          type: string
        # null mientras no se haya guardado nada de ese día.
        mesa:
          oneOf:
            - $ref: "#/components/schemas/MesaResumen"
            - type: "null"
        ingresos:
          type: array
          items:
            $ref: "#/components/schemas/MesaIngreso"
        egresos:
          type: array
          items:
            $ref: "#/components/schemas/MesaEgreso"
        totalIngresos:
          type: number
        totalEgresos:
          type: number
        saldo:
          type: number

    # Un renglón del resumen: "Árbitros: $1.200.000".
    ResumenMesaLinea:
      type: object
      required: [nombre, total]
      properties:
        nombre:
          type: string
        total:
          type: number

    ResumenMesas:
      type: object
      required: [ingresos, egresos]
      properties:
        ingresos:
          type: array
          items:
            $ref: "#/components/schemas/ResumenMesaLinea"
        egresos:
          type: array
          items:
            $ref: "#/components/schemas/ResumenMesaLinea"

    MesaEstadoInput:
      type: object
      required: [estado]
      properties:
        estado:
          type: string
          enum: [abierta, cerrada]

    MesaGuardarInput:
      type: object
      required: [ingresos, egresos]
      properties:
        nombre:
          type: string
        observaciones:
          type: string
        ingresos:
          type: array
          items:
            type: object
            required: [concepto, monto]
            properties:
              equipoId:
                type: ["number", "null"]
              concepto:
                type: string
              monto:
                type: number
        egresos:
          type: array
          items:
            type: object
            required: [descripcion, valor]
            properties:
              categoria:
                type: ["string", "null"]
              descripcion:
                type: string
              valor:
                type: number
              partidoId:
                type: ["number", "null"]

    # Cambio de la propia contraseña: se exige la actual para confirmar
    # identidad, así un token robado no basta para dejar a alguien por fuera.
    CambiarPasswordInput:
      type: object
      required: [passwordActual, passwordNueva]
      properties:
        passwordActual:
          type: string
          minLength: 1
        passwordNueva:
          type: string
          minLength: 4

    # Usuario tal como lo ve la sesión: nunca incluye el hash de contraseña.
    SessionUser:
      type: object
      required: [id, username, nombre, rol]
      properties:
        id:
          type: number
        username:
          type: string
        nombre:
          type: string
        rol:
          type: string
        equipoId:
          type: ["number", "null"]

    LoginResult:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/SessionUser"

    # ── AJUSTES ──────────────────────────────────────────────────────────────
    Ajustes:
      type: object
      required:
        [
          id,
          valorArbitrajePrimeraVuelta,
          valorArbitrajeSegundaVuelta,
          valorArbitrajeMuerteSubita,
          valorTernaMuerteSubita,
          ternaMuerteSubita,
          valorArbitrajeFinalLiguilla,
          valorTernaFinalLiguilla,
          ternaFinalLiguilla,
          valorArbitrajeSemifinalLiguilla,
          valorTernaSemifinalLiguilla,
          ternaSemifinalLiguilla,
          valorArbitrajeSemifinalTorneo,
          valorTernaSemifinalTorneo,
          ternaSemifinalTorneo,
          valorArbitrajeFinalTorneo,
          valorTernaFinalTorneo,
          ternaFinalTorneo,
          valorMesa,
          valorCintaCapitan,
          valorAmarilla,
          valorRoja,
          valorFofi,
          valorCarnet,
          valorMultaTorneosAnteriores,
          valorTraspaso,
          updatedAt,
        ]
      properties:
        id:
          type: number
        # Fases que siempre se pagan con 1 árbitro.
        valorArbitrajePrimeraVuelta:
          type: number
        valorArbitrajeSegundaVuelta:
          type: number
        # Fases que pueden ser 1 árbitro o terna: los dos valores + la
        # casilla que dice cuál de los dos se está pagando.
        valorArbitrajeMuerteSubita:
          type: number
        valorTernaMuerteSubita:
          type: number
        ternaMuerteSubita:
          type: boolean
        valorArbitrajeFinalLiguilla:
          type: number
        valorTernaFinalLiguilla:
          type: number
        ternaFinalLiguilla:
          type: boolean
        valorArbitrajeSemifinalLiguilla:
          type: number
        valorTernaSemifinalLiguilla:
          type: number
        ternaSemifinalLiguilla:
          type: boolean
        valorArbitrajeSemifinalTorneo:
          type: number
        valorTernaSemifinalTorneo:
          type: number
        ternaSemifinalTorneo:
          type: boolean
        valorArbitrajeFinalTorneo:
          type: number
        valorTernaFinalTorneo:
          type: number
        ternaFinalTorneo:
          type: boolean
        # La mesa: lo que paga CADA equipo por cada partido que juega ese
        # día. En las fases con terna, cada equipo paga el doble.
        valorMesa:
          type: number
        valorCintaCapitan:
          type: number
        # El valor que se le asigna automáticamente a cada tarjeta amarilla
        # nueva que se registra desde la planilla de un partido.
        valorAmarilla:
          type: number
        valorRoja:
          type: number
        valorFofi:
          type: number
        valorCarnet:
          type: number
        valorMultaTorneosAnteriores:
          type: number
        valorTraspaso:
          type: number
        updatedAt:
          type: string

    AjustesUpdate:
      type: object
      properties:
        valorArbitrajePrimeraVuelta:
          type: number
        valorArbitrajeSegundaVuelta:
          type: number
        valorArbitrajeMuerteSubita:
          type: number
        valorTernaMuerteSubita:
          type: number
        ternaMuerteSubita:
          type: boolean
        valorArbitrajeFinalLiguilla:
          type: number
        valorTernaFinalLiguilla:
          type: number
        ternaFinalLiguilla:
          type: boolean
        valorArbitrajeSemifinalLiguilla:
          type: number
        valorTernaSemifinalLiguilla:
          type: number
        ternaSemifinalLiguilla:
          type: boolean
        valorArbitrajeSemifinalTorneo:
          type: number
        valorTernaSemifinalTorneo:
          type: number
        ternaSemifinalTorneo:
          type: boolean
        valorArbitrajeFinalTorneo:
          type: number
        valorTernaFinalTorneo:
          type: number
        ternaFinalTorneo:
          type: boolean
        valorMesa:
          type: number
        valorCintaCapitan:
          type: number
        valorAmarilla:
          type: number
        valorRoja:
          type: number
        valorFofi:
          type: number
        valorCarnet:
          type: number
        valorMultaTorneosAnteriores:
          type: number
        valorTraspaso:
          type: number

    # ── USUARIOS ─────────────────────────────────────────────────────────────
    Usuario:
      type: object
      required: [id, username, nombre, rol]
      properties:
        id:
          type: number
        username:
          type: string
        nombre:
          type: string
        rol:
          type: string
        equipoId:
          type: ["number", "null"]
        activo:
          type: boolean
        createdAt:
          type: string

    UsuarioInput:
      type: object
      required: [username, password, nombre, rol]
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 4
        nombre:
          type: string
          minLength: 1
        rol:
          type: string
        equipoId:
          type: ["number", "null"]
        activo:
          type: boolean

    UsuarioUpdate:
      type: object
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 4
        nombre:
          type: string
          minLength: 1
        rol:
          type: string
        equipoId:
          type: ["number", "null"]
        activo:
          type: boolean

    # ── VALLAS ───────────────────────────────────────────────────────────────
    Valla:
      type: object
      required: [equipoId, equipoNombre, partidosJugados, golesRecibidos]
      properties:
        equipoId:
          type: number
        equipoNombre:
          type: string
        partidosJugados:
          type: number
        golesRecibidos:
          type: number
        promedio:
          type: number

    # ── SANCIONES ────────────────────────────────────────────────────────────
    Sancion:
      type: object
      required: [tarjetaId, jugadorId, jugadorNombre, equipoId, equipoNombre, tipo, semana, fechasSancion, fechasCumplidas, fechasPendientes]
      properties:
        tarjetaId:
          type: number
        jugadorId:
          type: number
        jugadorNombre:
          type: string
        equipoId:
          type: number
        equipoNombre:
          type: string
        tipo:
          type: string
        semana:
          type: number
        fecha:
          type: ["string", "null"]
        fechasSancion:
          type: number
        fechasCumplidas:
          type: number
        fechasPendientes:
          type: number

    # ── PLANILLA ─────────────────────────────────────────────────────────────
    PlanillaJugador:
      type: object
      required: [jugadorId, jugadorNombre, equipoId, jugo, titular, goles, amarillas, rojas]
      properties:
        jugadorId:
          type: number
        jugadorNombre:
          type: string
        equipoId:
          type: number
        nCarnet:
          type: ["number", "null"]
        jugo:
          type: boolean
        dorsal:
          type: ["number", "null"]
        titular:
          type: boolean
        goles:
          type: number
        amarillas:
          type: number
        rojas:
          type: number
        fechasSancion:
          type: number
        # Fechas de sanción que el jugador todavía NO había cumplido cuando
        # se jugó este partido. Mayor que cero = no se puede alinear.
        fechasPendientes:
          type: number

    Planilla:
      type: object
      required: [partidoId, localId, visitanteId, jugadores]
      properties:
        partidoId:
          type: number
        localId:
          type: number
        visitanteId:
          type: number
        arbitro:
          type: ["string", "null"]
        mesa:
          type: ["string", "null"]
        jugadores:
          type: array
          items:
            $ref: "#/components/schemas/PlanillaJugador"

    SavePlanillaInput:
      type: object
      required: [jugadores]
      properties:
        arbitro:
          type: string
        mesa:
          type: string
        # Ya no se manda valorAmarilla/valorRoja desde acá: el valor de cada
        # tarjeta nueva se asigna solo, tomándolo de /ajustes en el momento
        # de guardar la planilla (ver routes/planilla.ts).
        jugadores:
          type: array
          items:
            type: object
            required: [jugadorId, jugo]
            properties:
              jugadorId:
                type: number
              jugo:
                type: boolean
              dorsal:
                type: ["number", "null"]
              titular:
                type: boolean
              goles:
                type: number
                minimum: 0
              amarillas:
                type: number
                minimum: 0
                maximum: 2
              rojas:
                type: number
                minimum: 0
                maximum: 1
              fechasSancion:
                type: number
                minimum: 0
                maximum: 20

    # ── GOLES ────────────────────────────────────────────────────────────────
    Gol:
      type: object
      required: [id, jugadorId, jugadorNombre, equipoNombre, semana, cantidad]
      properties:
        id:
          type: number
        jugadorId:
          type: number
        jugadorNombre:
          type: string
        equipoNombre:
          type: string
        partidoId:
          type: ["number", "null"]
        semana:
          type: number
        fecha:
          type: ["string", "null"]
        cantidad:
          type: number
        propio:
          type: boolean
        createdAt:
          type: string

    GolInput:
      type: object
      required: [jugadorId, semana]
      properties:
        jugadorId:
          type: number
        partidoId:
          type: number
        semana:
          type: number
        fecha:
          type: string
        cantidad:
          type: number
          minimum: 1
        propio:
          type: boolean

    # ── EGRESOS ──────────────────────────────────────────────────────────────
    Egreso:
      type: object
      required: [id, fecha, descripcion, valor]
      properties:
        id:
          type: number
        fecha:
          type: string
        descripcion:
          type: string
        categoria:
          type: ["string", "null"]
        valor:
          type: number
        createdAt:
          type: string

    EgresoInput:
      type: object
      required: [fecha, descripcion, valor]
      properties:
        fecha:
          type: string
          minLength: 1
        descripcion:
          type: string
          minLength: 1
        categoria:
          type: string
        valor:
          type: number
          minimum: 0
